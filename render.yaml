# Render Blueprint — deploys both services from this one repo.
# https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New -> Blueprint -> connect this repo -> Apply.
# Service names below become your public URLs:
#   backend:  https://ffdash-backend.onrender.com
#   frontend: https://ffdash-frontend.onrender.com
# Rename either service before applying if you want a different subdomain —
# just keep the two envVars below (VITE_API_BASE_URL / FFDASH_CORS_ALLOWED_ORIGINS)
# in sync with whatever names you pick.

services:
  - type: web
    name: ffdash-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FFDASH_CORS_ALLOWED_ORIGINS
        value: https://ffdash-frontend.onrender.com

  - type: web
    name: ffdash-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ffdash-backend.onrender.com
    routes:
      # SPA fallback: unknown paths (e.g. a refresh on a client-side route)
      # still serve index.html instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
